name: Continuous Integration
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  astro-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Run Astro check
        run: bun --cwd apps/web astro check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Generate Astro types
        run: bun --cwd apps/web astro sync
      - name: Typecheck
        run: bun x tsc --project apps/web/tsconfig.json --noEmit
