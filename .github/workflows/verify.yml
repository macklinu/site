name: Verify
on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_call:
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  astro-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.8.3
          shim: true
      - name: Install dependencies
        run: nub install --frozen-lockfile
      - name: Run Astro check
        run: nub exec --node --cwd apps/web astro check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.8.3
          shim: true
      - name: Install dependencies
        run: nub install --frozen-lockfile
      - name: Generate Astro types
        run: nub exec --node --cwd apps/web astro sync
      - name: Typecheck
        run: nub exec tsc --project apps/web/tsconfig.json --noEmit
