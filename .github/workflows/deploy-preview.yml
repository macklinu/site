name: Deploy preview
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
concurrency:
  group: deploy-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false
permissions:
  contents: read
  pull-requests: write
env:
  STAGE: pr-${{ github.event.number }}
  ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
  ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
  PULL_REQUEST: ${{ github.event.number }}
  BUILD_SHA: ${{ github.sha }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  deploy-preview:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.5.0
      - name: Set up pnpm shim
        run: |
          nub pm shim
          echo "$HOME/.nub/shims" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: nub install --frozen-lockfile
      - name: Deploy
        run: nub run deploy -- --yes --stage ${{ env.STAGE }}

  cleanup-preview:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.5.0
      - name: Set up pnpm shim
        run: |
          nub pm shim
          echo "$HOME/.nub/shims" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: nub install --frozen-lockfile
      - name: Destroy Preview Environment
        run: nub run destroy -- --yes --stage ${{ env.STAGE }}
